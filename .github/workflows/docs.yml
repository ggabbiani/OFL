name: Publish Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ggabbiani/ofl:ubuntu
      # Simuliamo il mount del repo su /import
      options: --workdir /import

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory .

      - name: Generate Documentation
        # Lo script è l'entry-point dell'immagine docker, che usa la
        # variabile GITHUB_WORKSPACE per il repo. Questa variabile viene
        # impostata di default a /import per le esecuzioni manuali dei
        # container, e mi aspetto sia gestita da github quando eseguita
        # tramite devops
        run: |
          make-import.sh docs/all

      - name: Deploy with Mike
        shell: bash
        # la directory corrente corrisponde alla root del repo contenente il
        # file mkdocs.yml necessario a mike
        run: |
          # attivo il virtual environment Python dov'è installato mike
          source /venv/bin/activate
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$(echo $GITHUB_REF | sed 's/refs\/tags\///' | cut -d. -f1,2)
            mike deploy --push --update-aliases $VERSION latest
          else
            mike deploy --push main
          fi