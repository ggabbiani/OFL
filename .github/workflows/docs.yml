name: Publish Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ggabbiani/ofl:ubuntu
      # Simuliamo il mount del repo su /import
      options: --workdir /import

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Questo scarica il contenuto del repo in /import
          path: /import

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Git deve sapere che /import è una directory sicura
          git config --global --add safe.directory /import

      - name: Generate Documentation
        run: |
          # Lo script gira nella pwd di default,
          # ma il repo è pronto in /import come richiesto
          make-import.sh docs/all

      - name: Deploy with Mike
        # Mike deve girare dove si trova il file mkdocs.yml (quindi in /import)
        working-directory: /import
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$(echo $GITHUB_REF | sed 's/refs\/tags\///' | cut -d. -f1,2)
            mike deploy --push --update-aliases $VERSION latest
          else
            mike deploy --push main
          fi