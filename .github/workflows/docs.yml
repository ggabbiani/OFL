name: Publish Documentation

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ggabbiani/ofl:ubuntu
      # Simuliamo il mount del repo su /import
      options: --workdir /import

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory /import

      - name: Generate Documentation
        run: |
          whoami
          pwd
          ls -a
          make-import.sh docs/all

      - name: Deploy with Mike
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$(echo $GITHUB_REF | sed 's/refs\/tags\///' | cut -d. -f1,2)
            mike deploy --push --update-aliases $VERSION latest
          else
            mike deploy --push main
          fi