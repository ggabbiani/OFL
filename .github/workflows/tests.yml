# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  DOCKER_LOCAL: ofl:fedora
  DOCKER_REMOTE: ggabbiani/ofl:fedora

jobs:

  fedora:
    name: Fedora
    runs-on: ubuntu-latest

    steps:

      # Checks-out repo on $GITHUB_WORKSPACE
      - name: Project checkout
        uses: actions/checkout@v3
        with:
          # Number of commits to fetch. 0 indicates all history for all branches
          # and tags (default 1).
          fetch-depth: '0'

      # System update and pre-requisite install
      - name: System setup
        run: |
          sudo apt update
          sudo apt upgrade -y

      # Check if any docker/fedora/* file changed in the last commit.
      # See also
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
      # and
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-output-parameter
      - name: Docker changes
        id: docker
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD~1
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^docker/fedora/'; then
            echo changed=yes >> "$GITHUB_OUTPUT"
          else
            echo changed=no >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: tests on new local docker image
        if: steps.docker.outputs.changed=='yes'
        run: |
          # local docker image build
          make -s docker/fedora-build
          # documentation make and tests execution @local image
          docker run -v .:/import:Z --rm ${DOCKER_LOCAL} all

      - name: tests on existing remote docker image
        if: steps.docker.outputs.changed=='no'
        run: |
          # documentation make and tests execution @remote image
          docker run -v .:/import:Z --rm ${DOCKER_REMOTE} all

      - name: Docker Hub Login needed
        if: steps.docker.outputs.changed=='yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: new local docker image push
        if: steps.docker.outputs.changed=='yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${DOCKER_LOCAL} ${DOCKER_REMOTE}
          docker push ${DOCKER_REMOTE}

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:

      # Checks-out repo on $GITHUB_WORKSPACE
      - name: Project checkout
        uses: actions/checkout@v3
        with:
          # Number of commits to fetch. 0 indicates all history for all branches
          # and tags (default 1).
          fetch-depth: '0'

      # System update and pre-requisite install
      - name: System setup
        run: |
          sudo apt update
          sudo apt upgrade -y

      # Check if any docker/ubuntu/* file changed in the last commit.
      # See also
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
      # and
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-output-parameter
      - name: Docker changes
        id: docker
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD~1
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^docker/ubuntu/'; then
            echo changed=yes >> "$GITHUB_OUTPUT"
          else
            echo changed=no >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: tests on new local docker image
        if: steps.docker.outputs.changed=='yes'
        run: |
          # local docker image build
          make -s docker/ubuntu-build
          # documentation make and tests execution @local image
          docker run -v .:/import:Z --rm ${DOCKER_LOCAL} all

      - name: tests on existing remote docker image
        if: steps.docker.outputs.changed=='no'
        run: |
          # documentation make and tests execution @remote image
          docker run -v .:/import:Z --rm ${DOCKER_REMOTE} all

      - name: Docker Hub Login needed
        if: steps.docker.outputs.changed=='yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: new local docker image push
        if: steps.docker.outputs.changed=='yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${DOCKER_LOCAL} ${DOCKER_REMOTE}
          docker push ${DOCKER_REMOTE}
