version: 2
updates:
  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # base images of the test containers
  - package-ecosystem: "docker"
    directories:
      - "/docker/fedora"
      - "/docker/ubuntu"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]

  # Python tooling (tests and documentation)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
