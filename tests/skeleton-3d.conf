#
# Base configuration for 3d tests: copied by bin/new-test.py, it produces a
# minimal working test to be extended.
#
# Edit THIS file, never the generated «name»-test.scad (it is rebuilt from this
# file + tests/template-3d.scad + tests/defaults.conf).
#
# Multi-line values are quoted heredocs (<<'EOF'): OpenSCAD code is copied
# verbatim, so neither quotes nor $ need escaping.
#
# Any other variable used by the template (TAB_PARAMETERS, TAB_Debug,
# TAB_Placement, TEST_PROLOGUE...) can be overridden here, see
# tests/defaults.conf for their default values.
#
# Customizer presets saved in «name»-test.json are run as test cases when
# named TEST_CASE*, and can be reused by the documentation pictures when
# named fig_*.
