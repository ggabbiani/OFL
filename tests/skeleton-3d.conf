#

TEST_DESCRIPTION="TODO: describe the test scope"

TEST_TEMPLATE="template-3d.scad"

# ARG_CAMERA="0,0,0,0,0,0,7"

TEST_INCLUDES=$(cat <<'EOF'
include <@LIB@/foundation/core.scad>
use <@LIB@/foundation/3d-engine.scad>
EOF
)

TAB_TEST=$(cat <<'EOF'
/* [TEST] */

SIZE  = [1,2,3];
EOF
)

TEST_CODE=$(cat <<'EOF'
fl_cube(FL_ADD,size=SIZE,octant=octant,direction=direction);
EOF
)
