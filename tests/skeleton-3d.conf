#
# Test configuration, created by bin/new-test.py from tests/skeleton-3d.conf.
#
# Edit THIS file, never the generated «name»-test.scad (rebuilt by make).
#
# Variables not set here are inherited from tests/defaults.conf when the .scad
# is generated, so the standard values are maintained in one place. To see the
# effective values:
#
#   make -s tests/«dir»/«name»-test.vars
#
# Multi-line values are quoted heredocs (<<'EOF'): OpenSCAD code is copied
# verbatim, so neither quotes nor $ need escaping.
#
# Customizer presets saved in «name»-test.json are run as test cases when
# named TEST_CASE*, and can be reused by the documentation pictures when
# named fig_*.
