TEST_DESCRIPTION="Dimension lines test"

TEST_TEMPLATE="template-3d.scad"

ARG_CAMERA="0,0,0,0,0,0,7"
ARG_PROJECTION="ortho"

TEST_INCLUDES=$(cat <<'EOF'
include <../../lib/OFL/foundation/dimensions.scad>
EOF
)

TAB_Verbs=$(cat <<'EOF'
/* [Supported verbs] */
// adds shapes to scene.
$FL_ADD       = "ON";   // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a bounding box containing the object
$FL_BBOX      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
EOF
)

TAB_Placement=""

TAB_Direction=""

TAB_Dimensions=$(cat <<'EOF'
/* [Dimension Lines] */
VIEW_TYPE     = "other";    // [other,right,top,bottom,left]
DIM_MODE      = "full";     // [full,label,value,silent]
DIM_GAP       = 1;          // [1:.1:10]
DIM_W         = 0.1;        // [0.1:0.1:1]
EOF
)

TEST_PROLOGUE="$PROLOGUE_NOGUI"

TEST_CODE=$(cat <<'EOF'
verbs   = fl_verbList([FL_ADD,FL_BBOX]);

d       = 4;
h       = 10;
cyl     = fl_cylinder_defaults(h=h,d=d);

dim_r = fl_Dimension(value=d/2,  label="r");
dim_d = fl_Dimension(value=d,    label="d");
dim_h = fl_Dimension(value=h,    label="h");

$vpr = fl_view(VIEW_TYPE);

fl_cylinder(h=h,d=d,$fn=100,$FL_ADD="ON");

if (fl_dbg_dimensions()) {
  fl_dimension(verbs,dim_r,
    view="top",
    gap=DIM_GAP,
    align="positive",
    object=cyl,
    distr="h+",
    line_width=DIM_W,
    mode=DIM_MODE
  ) fl_dimension(verbs,geometry=dim_d,align="centered")
      fl_dimension(verbs,geometry=dim_d,align=-1.5);

  fl_dimension(verbs,dim_h,
    view="right",
    gap=DIM_GAP,
    align="positive",
    object=cyl,
    distr="h+",
    line_width=DIM_W,
    mode=DIM_MODE
  );

  fl_dimension(verbs,dim_r,
    view="right",
    gap=DIM_GAP,
    align="positive",
    object=cyl,
    distr="v+",
    line_width=DIM_W,
    mode=DIM_MODE
  );
}
EOF
)
