TEST_DESCRIPTION="fl_2d_closest() tests: smallest distance between a set of 2d points"
TEST_TEMPLATE="template-nogui.scad"
TEST_PROLOGUE="$PROLOGUE_NOGUI"
# NOTE: only 2d-engine.scad is used on purpose, in order to verify that
# fl_2d_closest() doesn't depend on other engines (i.e. 3d-engine.scad)
TEST_INCLUDES="
include <../../lib/OFL/foundation/unsafe_defs.scad>
use <../../lib/OFL/foundation/2d-engine.scad>
"

TEST_CODE="
// O(n²) reference implementation
function brute(p) = let(n=len(p))
  n<2 ? undef : min([for(i=[0:n-1],j=[i+1:1:n-1]) norm([p[i].x-p[j].x,p[i].y-p[j].y])]);

function same(a,b) = is_undef(a) ? is_undef(b) : !is_undef(b) && abs(a-b)<1e-9;

function msg(name,expected,result) = str(name,\": expected=\",expected,\" result=\",result);

module check(name,points,expected) let(
  result = fl_2d_closest(points)
) assert(same(result,expected),msg(name,expected,result));

//**** degenerate inputs ******************************************************

check(\"empty list\",       [],         undef);
check(\"single point\",     [[-2,4]],   undef);

//**** base cases (n=2, n=3) ***************************************************

check(\"two points\",       [[1,1],[0,0]],                sqrt(2));
check(\"three points\",     [[20,0],[-2,0],[-6,0]],       4);
// all the permutations of three points
let(
  p = [[-8,8],[-6,-5],[3,9]],
  e = brute(p)
) for(i=[0:2],j=[0:2],k=[0:2]) if (i!=j && j!=k && i!=k)
  check(str(\"three points permutation \",[i,j,k]),[p[i],p[j],p[k]],e);

//**** divide and conquer *****************************************************

check(\"four points\",      [[-1,0],[20,0],[-2,0],[6,0]], 1);
check(\"six points\",       [[2,3],[12,30],[40,50],[5,1],[12,10],[3,4]], sqrt(2));
check(\"near points\",      [[0,0],[0.1,0.1],[1,1],[2,2]], sqrt(0.02));
// closest couple crossing the dividing line with an even number of points
check(\"crossing pair (even n)\",  [[0,0],[3,10],[4,10],[100,0]],             1);
// closest couple crossing the dividing line with an odd number of points
check(\"crossing pair (odd n)\",   [[0,0],[3,10],[4,10],[100,0],[200,0]],     1);
// closest couple inside the strip, with other strip points before them in Y
check(\"strip pair\",       [[0,100],[1,-100],[9,0],[10,0.5],[11,100],[12,-100]], sqrt(1.25));

//**** special configurations *************************************************

check(\"duplicates\",       [[0,0],[0,0],[1,1],[2,2]],     0);
check(\"all duplicates\",   [[3,3],[3,3],[3,3],[3,3],[3,3]], 0);
check(\"same X\",           [[0,0],[0,5],[0,1.5],[0,9],[0,3]], 1.5);
check(\"same Y\",           [[7,2],[0,2],[2.5,2],[11,2],[4,2]], 1.5);
check(\"negative coords\",  [[-10,-10],[-7,-6],[-20,-20],[-7.5,-6.5]], sqrt(0.5));
// 3d points are accepted, Z is ignored
check(\"3d points\",        [[0,0,0],[1,0,100],[5,5,5],[9,9,9]], 1);

//**** pre-ordered input ******************************************************

let(
  p = [[-6,2],[-2,4],[1,10],[15,7],[20,4],[21,5]],
  e = brute(p),
  r = fl_2d_closest(p,pre_ordered=true)
) assert(same(r,e),msg(\"pre-ordered\",e,r));

//**** random point sets vs. brute force *************************************

for(seed=[0:199]) let(
  n   = 2+floor(rands(0,1,1,seed)[0]*40),
  xs  = rands(-10,10,n,seed+1000),
  ys  = rands(-10,10,n,seed+2000),
  // odd seeds: integer coordinates, inducing duplicates and equal X/Y values
  pts = seed%2 ?
    [for(i=[0:n-1]) [round(xs[i]),round(ys[i])]] :
    [for(i=[0:n-1]) [xs[i],ys[i]]],
  e   = brute(pts),
  // the result must not depend on the input order
  rev = [for(i=[n-1:-1:0]) pts[i]]
) {
  check(str(\"random seed \",seed),pts,e);
  check(str(\"random seed \",seed,\" (reversed)\"),rev,e);
}
"
