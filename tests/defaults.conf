# ARG_* are OpenSCAD command line arguments passed by bin/make-test.py when
# running the test: they are NOT expanded in the generated .scad, so they do
# not alter the scene built by the script. Empty means the OpenSCAD default.
#
# ARG_CAMERA     : OpenSCAD '--camera' option, in one of two formats
#                    gimbal (7 values) translate_x,y,z,rot_x,y,z,distance
#                                      i.e. "0,0,0,0,0,0,7"
#                    vector (6 values) eye_x,y,z,center_x,y,z
# ARG_PROJECTION : OpenSCAD '--projection' option, o(rtho) or p(erspective)
#
# Multi-line values are quoted heredocs (<<'EOF'): OpenSCAD code is copied
# verbatim, so neither quotes nor $ need escaping. The PROLOGUE_* values that
# embed $PROLOGUE_DEBUG use an UNQUOTED heredoc (<<EOF) instead: there shell
# expansion is active, so any OpenSCAD '$' must be escaped as '\$'.
ARG_CAMERA=""
ARG_PROJECTION=""

TAB_PARAMETERS=$(cat <<'EOF'
// number of segments
$fn            = 50;           // [3:100]
// When true, disables PREVIEW corrections like FL_EPS
$FL_RENDER     = false;
// Default color for printable items (i.e. artifacts)
$fl_filament   = "DodgerBlue"; // [DodgerBlue,Blue,OrangeRed,SteelBlue]
// When false polyRound() is disabled
$fl_polyround  = true;
EOF
)

Placement_3D=$(cat <<'EOF'
/* [3D Placement] */

X_PLACE = "undef";  // [undef,-1,0,+1]
Y_PLACE = "undef";  // [undef,-1,0,+1]
Z_PLACE = "undef";  // [undef,-1,0,+1]
EOF
)

Placement_2D=$(cat <<'EOF'
/* [2D Placement] */

X_PLACE = "undef";  // [undef,-1,0,+1]
Y_PLACE = "undef";  // [undef,-1,0,+1]
EOF
)

PROLOGUE_DEBUG=$(cat <<'EOF'
$dbg_Assert     = DEBUG_ASSERTIONS;
$dbg_Dimensions = DEBUG_DIMENSIONS;
$dbg_Color      = DEBUG_COLOR;
$dbg_Components = DEBUG_COMPONENTS[0]=="none" ? undef : DEBUG_COMPONENTS;
$dbg_Labels     = DEBUG_LABELS;
$dbg_Symbols    = DEBUG_SYMBOLS;
EOF
)

# unquoted heredocs: $PROLOGUE_DEBUG is expanded
PROLOGUE_NOGUI=$(cat <<EOF
$PROLOGUE_DEBUG

fl_status();
EOF
)

PROLOGUE_2D=$(cat <<EOF
$PROLOGUE_DEBUG

quadrant    = fl_parm_Quadrant(X_PLACE,Y_PLACE);

fl_status();
EOF
)

PROLOGUE_3D=$(cat <<EOF
$PROLOGUE_DEBUG

direction       = DIR_NATIVE    ? undef : [DIR_Z,DIR_R];
octant          = fl_parm_Octant(X_PLACE,Y_PLACE,Z_PLACE);

fl_status();
EOF
)

TEST_TEMPLATE="template-3d.scad"
TEST_PROLOGUE="$PROLOGUE_3D"

TAB_Debug=$(cat <<'EOF'
/* [Debug] */

// -2⇒none, -1⇒all, [0..)⇒max depth allowed
$FL_TRACES        = -2;     // [-2:10]
DEBUG_ASSERTIONS  = false;
DEBUG_COMPONENTS  = ["none"];
DEBUG_COLOR       = false;
DEBUG_DIMENSIONS  = false;
DEBUG_LABELS      = false;
DEBUG_SYMBOLS     = false;
EOF
)

TAB_Verbs=$(cat <<'EOF'
/* [Supported verbs] */

// adds shapes to scene.
$FL_ADD       = "ON";   // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// layout of predefined auxiliary shapes (like predefined screws)
$FL_ASSEMBLY  = "ON";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds local reference axes
$FL_AXES      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a bounding box containing the object
$FL_BBOX      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// layout of predefined drill shapes (like holes with predefined screw diameter)
$FL_DRILL     = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a footprint to scene, usually a simplified FL_ADD
$FL_FOOTPRINT = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// layout of user passed accessories (like alternative screws)
$FL_LAYOUT    = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// mount shape through predefined screws
$FL_MOUNT     = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
EOF
)

TAB_Placement="$Placement_3D"

TAB_Direction=$(cat <<'EOF'
/* [Direction] */

DIR_NATIVE  = true;
// ARBITRARY direction vector
DIR_Z       = [0,0,1];  // [-1:0.1:+1]
// rotation around
DIR_R       = 0;        // [-360:360]
EOF
)

TAB_Dimensions=$(cat <<'EOF'
/* [Dimension Lines] */
VIEW_TYPE     = "other";    // [other,right,top,bottom,left,front,back]
DIM_MODE      = "full";     // [full,label,value,silent]
DIM_GAP       = 1;          // [1:.1:10]
DIM_W         = 0.05;       // [0.01:0.01:1]
EOF
)
