TEST_DESCRIPTION="Test file for 'naive' SATA adapter"

TEST_TEMPLATE="template-3d.scad"

TEST_INCLUDES=$(cat <<'EOF'
include <../../lib/OFL/vitamins/sata-adapters.scad>
EOF
)

TAB_Verbs=$(cat <<'EOF'
/* [Supported verbs] */

// adds shapes to scene.
$FL_ADD       = "ON";   // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds local reference axes
$FL_AXES      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a bounding box containing the object
$FL_BBOX      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
EOF
)

TAB_Dimensions=""
TEST_CODE=$(cat <<'EOF'
verbs = fl_verbList([FL_ADD,FL_AXES,FL_BBOX]);

sata_adapter(verbs,FL_SADP_ELUTENG,octant=octant,direction=direction);
EOF
)
