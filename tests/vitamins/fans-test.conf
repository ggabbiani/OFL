TEST_DESCRIPTION="NopSCADlib fan wrapper test."

TEST_TEMPLATE="template-3d.scad"

TEST_INCLUDES=$(cat <<'EOF'
include <../../lib/OFL/vitamins/fans.scad>
include <../../lib/OFL/vitamins/screw.scad>
EOF
)

TAB_Verbs=$(cat <<'EOF'
/* [Supported verbs] */

// adds shapes to scene.
$FL_ADD       = "ON";   // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds local reference axes
$FL_AXES      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a bounding box containing the object
$FL_BBOX      = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// layout of predefined drill shapes (like holes with predefined screw diameter)
$FL_DRILL     = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// adds a footprint to scene, usually a simplified FL_ADD
$FL_FOOTPRINT = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// layout of user passed accessories (like alternative screws)
$FL_LAYOUT    = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
// mount shape through predefined screws
$FL_MOUNT     = "OFF";  // [OFF,ON,ONLY,DEBUG,TRANSPARENT]
EOF
)

TAB_Dimensions=""
TAB_TEST=$(cat <<'EOF'
/* [FACTORY] */
SHOW  = "ALL";  // [ALL,17x17x8mm fan,25.4x25.4x10mm fan,30x30x10mm fan,40x40x11mm fan,50x50x15mm fan,60x60x15mm fan,60x60x25mm fan,70x70x15mm fan,80x80x25mm fan,80x80x38mm fan,120x120x25mm fan]

/* [TEST] */
// thickness on +Z axis
THICK_POSITIVE = 1.6;      // [0:0.1:10]
// thickness on -Z axis
THICK_NEGATIVE = 2.5;      // [0:0.1:10]
EOF
)

TEST_CODE=$(cat <<'EOF'
verbs = fl_verbList([
  FL_ADD,
  FL_AXES,
  FL_BBOX,
  FL_DRILL,
  FL_FOOTPRINT,
  FL_LAYOUT,
  FL_MOUNT,
]);
thickness = let(
  t = [
    if (THICK_NEGATIVE) -THICK_NEGATIVE,
    if (THICK_POSITIVE) +THICK_POSITIVE
  ]
) t ? t : undef;

fan = fl_switch(SHOW,fl_list_pack(FL_FAN_NAMES,FL_FAN_INV));

if (fan) {
  screw = fl_fan_screw(fan);
  fl_fan(verbs,fan,thick=thickness,octant=octant,direction=direction)
    fl_screw(type=screw,$fl_thickness=$fan_thick,direction=$fan_direction);
} else {
  fl_layout(axis=+X, gap=3, types=FL_FAN_INV,$FL_LAYOUT="ON") let(
    screw = fl_fan_screw($item)
  ) fl_fan(verbs,$item,thick=thickness,octant=octant,direction=direction)
    fl_screw(type=screw,$fl_thickness=$fan_thick,direction=$fan_direction);
}
EOF
)
