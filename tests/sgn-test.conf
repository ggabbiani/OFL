TEST_DESCRIPTION="Configuration for fl_vector_sign() tests"

TEST_TEMPLATE="template-3d.scad"

TEST_INCLUDES=$(cat <<'EOF'
include <../lib/OFL/foundation/core.scad>
EOF
)

TAB_Verbs=""
TAB_Dimensions=""
TAB_TEST=$(cat <<'EOF'
/* [TEST] */
P = [1,-2,3];
EOF
)

TEST_CODE=$(cat <<'EOF'
fl_vector(P);
fl_color("red") fl_vector(norm(P)*fl_versor(fl_vector_sign(P)));
EOF
)
